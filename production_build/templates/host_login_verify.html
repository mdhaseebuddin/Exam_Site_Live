<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Verification — Exam Platform</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="exam-body">
  <main class="exam-main container-fluid">
    <div class="card shadow mx-auto w-100">
      <div class="card-body p-4">
        <h1 class="h3 mb-3 text-center">Verify Login</h1>
        <p class="text-muted small text-center">A 6-digit code has been sent to {{ email }}. Check your email or the terminal logs.</p>
        
        {% if error %}
          <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-info py-2 small">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">6-Digit Code</label>
            <input type="text" class="form-control" name="otp" required maxlength="6" pattern="\d{6}" placeholder="123456" inputmode="numeric">
          </div>
          <button type="submit" name="action" value="verify" class="btn btn-primary w-100">Verify & Login</button>
          <button type="submit" name="action" value="resend" class="btn btn-link w-100 mt-2 text-decoration-none">Resend Code</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
