<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host Registration — Exam Platform</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="exam-body">
        <main class="exam-main container-fluid">
    <div class="card shadow mx-auto w-100">

      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="display-6 mb-2">📝</div>
          <h1 class="h3">Create Host Account</h1>
          <p class="text-muted mb-0">Register to manage your exams.</p>
        </div>

        {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('host_register') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="mb-3">
            <label class="form-label">Full Name</label>
            <input class="form-control" type="text" name="name" required autocomplete="name"
                   value="{{ form.get('name', '') }}" placeholder="Your full name">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" name="email" required autocomplete="email"
                   value="{{ form.get('email', '') }}" placeholder="you@example.com">
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required autocomplete="new-password"
                   minlength="8" placeholder="Min 8 characters">
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input class="form-control" type="password" name="confirm" required autocomplete="new-password"
                   minlength="8" placeholder="Repeat password">
          </div>

          <div class="mb-3">
            <label class="form-label">Security Check</label>
            <div class="input-group">
              <span class="input-group-text fw-semibold">{{ captcha.left }} {{ captcha.op }} {{ captcha.right }} =</span>
              <input class="form-control" type="number" name="captcha" required placeholder="Your answer">
            </div>
            <div class="form-text">Solve the math problem to prove you're human.</div>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="agree" id="agree" value="1" required>
            <label class="form-check-label small" for="agree">
              I Agree to the
              <a href="{{ url_for('privacy') }}" target="_blank" rel="noopener">Terms &amp; Privacy Policy</a>.
              I understand the platform is not liable for data loss, breaches, or misuse, and I take
              full responsibility for how the exams and any materials are used.
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">Create Account</button>
        </form>

        <div class="text-center mt-3 small">
          Already have an account?
          <a href="{{ url_for('host_login') }}">Log in</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
